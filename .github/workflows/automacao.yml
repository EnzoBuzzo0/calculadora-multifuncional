name: Automação da Calculadora

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:

  verificar-projeto:
    name: Verificar projeto
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do projeto
        uses: actions/checkout@v4

      - name: Verificar arquivos principais
        run: |
          echo "Verificando estrutura da Calculadora Multifuncional..."

          test -f index.html
          test -f style.css
          test -f script.js

          echo "Todos os arquivos principais foram encontrados!"

  publicar:
    name: Publicar no GitHub Pages
    needs: verificar-projeto
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar o código do projeto
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
