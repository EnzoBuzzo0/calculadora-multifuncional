<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Multifuncional</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculadora">

        <h1>Calculadora Multifuncional</h1>

        <label for="numero1">Número 1 (ou Valor principal)</label>
        <input type="number" id="numero1" step="any" placeholder="Digite o primeiro número">

        <label for="numero2">Número 2 (se aplicável)</label>
        <input type="number" id="numero2" step="any" placeholder="Digite o segundo número">

        <div class="botoes">
            <!-- Operações Básicas -->
            <button onclick="somar()">Somar</button>
            <button onclick="subtrair()">Subtrair</button>
            <button onclick="multiplicar()">Multiplicar</button>
            <button onclick="dividir()">Dividir</button>
            <button onclick="porcentagem()">%</button>
            <button onclick="adicionarVirgula()">,</button>

            <!-- Funções Avançadas -->
            <button onclick="raizQuadrada()" class="btn-cientifico">√ (Raiz)</button>
            <button onclick="seno()" class="btn-cientifico">Sen</button>
            <button onclick="cosseno()" class="btn-cientifico">Cos</button>
            <button onclick="tangente()" class="btn-cientifico">Tan</button>
            <button onclick="logaritmo()" class="btn-cientifico">Log (base 10)</button>

            <!-- Botão de Limpar -->
            <button onclick="limpar()" class="btn-ce">CE</button>
        </div>

        <h2 id="resultado">
            Resultado:
        </h2>

    </div>

    <script src="script.js"></script>

</body>

</html>
